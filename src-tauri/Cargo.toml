[package]
name = "klutz"
version = "1.4.1"
description = "GUI for managing and testing zapret-discord-youtube DPI bypass configs"
authors = ["vbu00"]
edition = "2021"

[[bin]]
name = "klutz"
path = "src/main.rs"
# Тестового харнесса у бинарника нет, а манифест требует прав администратора:
# `cargo test` пытался запустить klutz.exe и падал с «требуется повышение»
# (os error 740), хотя все тесты в библиотеке уже прошли.
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
notify-rust = "4"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_Globalization", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
